<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <style>
      .text-anim {
        animation: pulse 2s infinite alternate;
      }
      @keyframes pulse {
        0% { filter: drop-shadow(0 0 2px #fff); }
        100% { filter: drop-shadow(0 0 10px #fff); }
      }
    </style>
  </defs>
  <rect width="800" height="200" rx="20" fill="url(#grad1)"/>
  <text class="text-anim" x="50%" y="50%" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">
    Awesome Account Planning
  </text>
  <text x="50%" y="75%" font-family="Arial, sans-serif" font-size="20" fill="#f0f0f0" text-anchor="middle" dominant-baseline="middle">
    A Curated List of SaaS and Open-Source Solutions
  </text>
</svg>
